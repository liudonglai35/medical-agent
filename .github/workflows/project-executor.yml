name: Medical Agent Persistent Executor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

# This workflow is deliberately bound to a self-hosted runner. The hosted
# watchdog can detect a stall, but only a persistent executor can resume work.
permissions:
  contents: write

concurrency:
  group: medical-agent-project-executor
  cancel-in-progress: false

jobs:
  execute:
    if: ${{ vars.MEDICAL_AGENT_EXECUTOR_ENABLED == 'true' }}
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run persistent execution adapter
        env:
          AGENT_COMMAND: ${{ secrets.MEDICAL_AGENT_AGENT_COMMAND }}
          PROJECT_STATE: PROJECT_STATE.json
        run: |
          python3 scripts/execution_runner.py

      - name: Commit execution checkpoint
        run: |
          git config user.name 'medical-agent-runner'
          git config user.email 'medical-agent-runner@users.noreply.github.com'
          git add PROJECT_STATE.json .
          if git diff --cached --quiet; then
            echo 'No repository changes to commit.'
          else
            git commit -m 'chore: persist autonomous execution checkpoint'
            git push origin HEAD:main
          fi

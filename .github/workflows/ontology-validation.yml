name: Dermatology Ontology Validation

on:
  push:
    paths:
      - 'ontology/**'
      - 'scripts/generate_synthetic_cases.py'
      - 'tests/**'
      - 'requirements-dev.txt'
  pull_request:
    paths:
      - 'ontology/**'
      - 'scripts/generate_synthetic_cases.py'
      - 'tests/**'
      - 'requirements-dev.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate schema and synthetic trial
        run: python -m pytest tests/test_ontology_schema.py -q
